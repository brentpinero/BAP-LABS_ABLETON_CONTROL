[package]
name = "plughost_bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "C ABI over plughost so a C++ engine (Tracktion/JUCE) can host plugins out of process"

[lib]
crate-type = ["staticlib"]

# Same pinned release as the bake-off host: helper protocol must match the helper binary.
[dependencies]
plughost = "=0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
panic = "abort"   # never unwind across the C boundary
